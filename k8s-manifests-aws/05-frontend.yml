apiVersion: apps/v1
kind: Deployment
metadata:
  name: agropacayales-frontend-deployment
  namespace: agropacayales-k8s
  labels:
    app: agropacayales-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agropacayales-frontend
  template:
    metadata:
      labels:
        app: agropacayales-frontend
    spec:
      containers:
      - name: frontend
        image: anafelix/agropacayales-frontend:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: agropacayales-frontend-service
  namespace: agropacayales-k8s
spec:
  type: NodePort
  selector:
    app: agropacayales-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
